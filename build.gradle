plugins {
    id 'fabric-loom' version '1.2-SNAPSHOT'
    id 'maven-publish'
}

repositories {
    mavenCentral()
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
    maven {
        name = 'Mojang'
        url = 'https://libraries.minecraft.net/'
    }
}

extra {
    apply plugin: 'fabric-loom'
    minecraft {
        version = project.property('minecraft_version')
        runs {
            client {
                property 'minecraft.client.jar', project.property('minecraft_version') + '-client.jar'
                property 'minecraft.client.mappings', project.property('minecraft_version') + '-client.txt'
            }
            server {
                property 'minecraft.server.jar', project.property('minecraft_version') + '-server.jar'
                property 'minecraft.server.mappings', project.property('minecraft_version') + '-server.txt'
            }
        }
    }
}

dependencies {
    minecraft 'com.mojang:minecraft:${project.property('minecraft_version')}'
    mappings 'net.fabricmc:yarn:${project.property('minecraft_version')}+build.1:v2'
    modImplementation 'net.fabricmc:fabric-loader:${project.property('loader_version')}'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.91.0+1.21.11'
}

processResources {
    inputs.property 'version', project.property('mod_version')
    inputs.property 'minecraft_version', project.property('minecraft_version')
}

jar {
    from {
        configurations.compileClasspath.collect {
            it.isDirectory() ? it : zipTree(it)
        }
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = project.property('archives_base_name')
            groupId = project.property('maven_group')
        }
    }
}